<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
    <a href="index.html">REGRESAR</a>
</head>
<body>
    <center>
        <h1 style="color: brown;">FORMULARIO</h1>
    </center>

    <hr>
    <br><br>
    <form action="#" method="POST">

    
    <div class="campo">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre">
    </div>
    <br>

    <div class="campo">
      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" name="apellidos">
    </div>
    <br>

    <div class="campo">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo">
    </div>
<br>
    <div class="campo">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono">
    </div>
<br>
    <div class="campo">
      <label>Fecha de Nacimiento:</label>
      <select name="dia">
        
        <option value="19">19</option><option value="20">20</option><option value="21">21</option>
        <option value="22">22</option><option value="23">23</option><option value="24">24</option>
        <option value="25">25</option><option value="26">26</option><option value="27">27</option>
        <option value="28">28</option><option value="29">29</option><option value="30">30</option>
        <option value="31">31</option>
      </select>
<br>
      <select name="mes">
        <option value="">Mes</option>
        <option value="Enero">Enero</option>
        <option value="Febrero">Febrero</option>
        <option value="Marzo">Marzo</option>
        <option value="Abril">Abril</option>
        
      </select>
<br>
      <select name="anio">
        <option value="">Año</option>
    
        <option value="2012">2012</option><option value="2013">2013</option><option value="2014">2014</option>
        <option value="2015">2015</option><option value="2016">2016</option><option value="2017">2017</option>
        <option value="2018">2018</option><option value="2019">2019</option><option value="2020">2020</option>
        <option value="2021">2021</option><option value="2022">2022</option><option value="2023">2023</option>
        <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
      </select>
    </div>
<br>
    <div class="campo">
      <label for="facebook">Link de Facebook:</label>
      <input type="url" id="facebook" name="facebook">
    </div>
<br>
    <div class="campo">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password">
    </div>
<br>
    <div class="campo">
      <label for="observaciones">Observaciones:</label>
      <textarea id="observaciones" name="observaciones"></textarea>
    </div>
<br>
    <div class="campo">
      <label for="hermanos">Numero de Hermanos:</label>
      <input type="number" id="hermanos" name="hermanos">
    </div>
<br>
    <div class="campo">
      <label for="genero">Genero:</label>
      <select id="genero" name="genero">
        <option value="">-- Seleccionar --</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
<br>
    <div class="campo">
      <label for="semestre">Semestre:</label>
      <select id="semestre" name="semestre">
        <option value="">-- Seleccionar --</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        
      </select>
    </div>
<br>
    <div class="campo">
      <label for="carrera">Carrera:</label>
      <input type="text" id="carrera" name="carrera" list="carreras">
      <datalist id="carreras">
        <option value="Programación">
        <option value="Economia">
        <option value="Matemáticas">
        <option value="Inglés">
        <option value="Física">
      </datalist>
    </div>
<br>
<input type="hidden" name="matricula" value="12345678">
<br>
    <div class="campo">
      <input type="submit" value="Enviar">
      <input type="reset" value="Borrar">
    </div>
<br>
  </form>
</body>
</html>
